[package]
name = "patent-reader-v1"
version = "1.1.1"
description = "Windows 本地专利阅读与图文关联辅助工具"
authors = ["Patent Reader"]
edition = "2021"

[lib]
name = "patent_reader_v1_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lopdf = "0.38"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rust_xlsxwriter = "0.96"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tempfile = "3"
zip = "2"
